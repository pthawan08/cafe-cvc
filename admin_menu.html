<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVC Cafe - จัดการเมนูหลังร้าน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #A07855; --bg: #FBF9F6; --text: #4A4A4A; --light: #F2EFE9; --active: #27AE60; --inactive: #E74C3C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background-color: #E8E4DD; display: flex; flex-direction: column; min-height: 100vh; color: var(--text); padding: 30px; align-items: center;}

        .container { width: 100%; max-width: 800px; }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: white; padding: 20px 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header h1 { font-size: 24px; color: var(--primary); }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 22px; background: white; border-radius: 20px; border: 1px solid #F0EAE1; cursor: pointer; font-size: 15px; color: #666; transition: 0.2s; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: 500; }

        .menu-table { background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; }
        .menu-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 15px 25px; border-bottom: 1px solid #F0EAE1; }
        .menu-row:last-child { border-bottom: none; }

        .menu-info { display: flex; align-items: center; gap: 15px; }
        .menu-icon { font-size: 30px; width: 45px; height: 45px; background: var(--bg); display: flex; justify-content: center; align-items: center; border-radius: 12px; }
        .menu-name { font-size: 16px; font-weight: 600; color: #333; }
        .menu-cat { font-size: 13px; color: #888; }

        .menu-actions { display: flex; align-items: center; gap: 15px; }

        /* ดีไซน์สวิตช์เปิด-ปิดใหม่ให้กดง่าย */
        .switch { position: relative; display: inline-block; width: 56px; height: 30px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input:checked + .slider { background-color: var(--active); }
        input:checked + .slider:before { transform: translateX(26px); }

        .status-text { font-size: 14px; font-weight: 500; width: 70px; text-align: right; }

        /* ส่วนจัดการท็อปปิ้ง */
        .add-form { display: flex; gap: 10px; padding: 20px 25px; background: var(--bg); border-bottom: 2px solid #F0EAE1; flex-wrap: wrap; }
        .field { padding: 10px 14px; border: 1px solid #E5E5E5; border-radius: 10px; font-size: 15px; outline: none; background: white; transition: 0.2s; }
        .field:focus { border-color: var(--primary); }
        .field-name { flex: 1; min-width: 180px; }
        .field-price { width: 110px; }
        .btn { padding: 10px 18px; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; color: white; background: var(--primary); transition: 0.2s; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-ghost { background: white; color: var(--primary); border: 1px solid var(--accent, #D5BDAF); }
        .btn-danger { background: white; color: var(--inactive); border: 1px solid #F5C6C1; }
        .topping-edit { display: flex; align-items: center; gap: 10px; flex: 1; }
        .hint { font-size: 13px; color: #888; padding: 12px 25px; }

        #loading { text-align: center; padding: 50px; font-size: 18px; color: #888; }

        @media (max-width: 600px) {
            body { padding: 15px; }
            .menu-row { padding: 12px 15px; flex-wrap: wrap; }
            .topping-edit { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>☕ จัดการเมนู & ท็อปปิ้ง</h1>
            <a href="admin.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">← กลับไปหน้าจัดการออเดอร์</a>
        </div>

        <div class="tabs">
            <div class="tab active" id="tab-menu" onclick="switchTab('menu')">🥤 เมนูเครื่องดื่ม</div>
            <div class="tab" id="tab-toppings" onclick="switchTab('toppings')">🧋 ท็อปปิ้ง</div>
        </div>

        <!-- แท็บ 1: เมนู -->
        <div id="section-menu">
            <div id="loading">กำลังโหลดรายการเมนู... ⏳</div>
            <div class="menu-table" id="menu-list" style="display: none;"></div>
        </div>

        <!-- แท็บ 2: ท็อปปิ้ง -->
        <div id="section-toppings" style="display: none;">
            <div class="menu-table">
                <div class="add-form">
                    <input type="text" id="new-topping-name" class="field field-name" placeholder="ชื่อท็อปปิ้งใหม่ เช่น วุ้นมะพร้าว">
                    <input type="number" id="new-topping-price" class="field field-price" placeholder="ราคา (฿)" min="0">
                    <button class="btn" id="add-topping-btn" onclick="addTopping()">+ เพิ่มท็อปปิ้ง</button>
                </div>
                <div id="topping-list"><div id="topping-loading" style="text-align:center; padding:30px; color:#888;">กำลังโหลดท็อปปิ้ง... ⏳</div></div>
                <div class="hint">💡 ท็อปปิ้งที่เปิดอยู่จะแสดงในหน้าสั่งของลูกค้า (LINE) และหน้า POS ทันที</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://zkjnamlcnffsuqzvkznx.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpram5hbWxjbmZmc3VxenZrem54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTk3MjIsImV4cCI6MjEwNTI5NTcyMn0.yUCmqbe5_tjsOBNEfx7qPXkmUiuoL5IX_y-tdjJuITY";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function switchTab(tab) {
            document.getElementById('tab-menu').classList.toggle('active', tab === 'menu');
            document.getElementById('tab-toppings').classList.toggle('active', tab === 'toppings');
            document.getElementById('section-menu').style.display = tab === 'menu' ? 'block' : 'none';
            document.getElementById('section-toppings').style.display = tab === 'toppings' ? 'block' : 'none';
        }

        // ================= เมนู =================
        async function fetchAdminMenu() {
            try {
                const { data, error } = await supabaseClient
                    .from('menu')
                    .select('*')
                    .order('menu_id', { ascending: true });

                if (error) throw error;
                renderMenuTable(data);

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerText = "โหลดข้อมูลไม่สำเร็จ";
            }
        }

        function renderMenuTable(menus) {
            const container = document.getElementById('menu-list');
            let html = '';

            menus.forEach(menu => {
                const icon = menu.image_url || '☕';
                const isActive = menu.is_active;

                html += `
                    <div class="menu-row">
                        <div class="menu-info">
                            <div class="menu-icon">${escapeHtml(icon)}</div>
                            <div>
                                <div class="menu-name">${escapeHtml(menu.name)} (${escapeHtml(menu.menu_id)})</div>
                                <div class="menu-cat">หมวด: ${escapeHtml(menu.category)} | เริ่มต้น ฿${menu.price_hot || menu.price_ice || menu.price_frappe || 0}</div>
                            </div>
                        </div>
                        <div class="menu-actions">
                            <span class="status-text" id="status-label-${menu.menu_id}" style="color: ${isActive ? 'var(--active)' : 'var(--inactive)'};">
                                ${isActive ? 'เปิดขาย' : 'ปิดหมด'}
                            </span>
                            <label class="switch">
                                <input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleMenuStatus('${menu.menu_id}', this)">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('loading').style.display = 'none';
            container.style.display = 'block';
        }

        async function toggleMenuStatus(menuId, checkbox) {
            const newState = checkbox.checked;
            const label = document.getElementById(`status-label-${menuId}`);

            label.innerText = "กำลังบันทึก...";

            try {
                const { error } = await supabaseClient
                    .from('menu')
                    .update({ is_active: newState })
                    .eq('menu_id', menuId);

                if (error) throw error;

                label.innerText = newState ? 'เปิดขาย' : 'ปิดหมด';
                label.style.color = newState ? 'var(--active)' : 'var(--inactive)';

            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาดในการอัปเดตสถานะ");
                checkbox.checked = !newState;
                label.innerText = !newState ? 'เปิดขาย' : 'ปิดหมด';
                label.style.color = !newState ? 'var(--active)' : 'var(--inactive)';
            }
        }

        // ================= ท็อปปิ้ง =================
        async function fetchToppings() {
            const list = document.getElementById('topping-list');
            try {
                const { data, error } = await supabaseClient
                    .from('toppings')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;
                renderToppings(data);

            } catch (error) {
                console.error("Error:", error);
                list.innerHTML = `<div style="text-align:center; padding:30px; color:var(--inactive);">
                    โหลดท็อปปิ้งไม่สำเร็จ<br><span style="font-size:13px; color:#888;">ถ้ายังไม่ได้สร้างตาราง toppings ให้รันไฟล์ supabase_setup.sql ใน Supabase SQL Editor ก่อน</span>
                </div>`;
            }
        }

        function renderToppings(toppings) {
            const list = document.getElementById('topping-list');

            if (toppings.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:30px; color:#888;">ยังไม่มีท็อปปิ้ง เพิ่มด้านบนได้เลย</div>';
                return;
            }

            list.innerHTML = toppings.map(t => `
                <div class="menu-row">
                    <div class="topping-edit">
                        <input type="text" class="field field-name" id="tp-name-${t.id}" value="${escapeHtml(t.name)}">
                        <input type="number" class="field field-price" id="tp-price-${t.id}" value="${t.price}" min="0">
                        <button class="btn btn-ghost" onclick="saveTopping(${t.id}, this)">บันทึก</button>
                        <button class="btn btn-danger" onclick="deleteTopping(${t.id}, this)" title="ลบท็อปปิ้ง">ลบ</button>
                    </div>
                    <div class="menu-actions">
                        <span class="status-text" id="tp-status-${t.id}" style="color: ${t.is_active ? 'var(--active)' : 'var(--inactive)'};">
                            ${t.is_active ? 'เปิดขาย' : 'ปิดหมด'}
                        </span>
                        <label class="switch">
                            <input type="checkbox" ${t.is_active ? 'checked' : ''} onchange="toggleTopping(${t.id}, this)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            `).join('');
        }

        async function addTopping() {
            const nameInput = document.getElementById('new-topping-name');
            const priceInput = document.getElementById('new-topping-price');
            const name = nameInput.value.trim();
            const price = parseInt(priceInput.value, 10);

            if (!name) { alert('กรุณากรอกชื่อท็อปปิ้ง'); nameInput.focus(); return; }
            if (isNaN(price) || price < 0) { alert('กรุณากรอกราคาให้ถูกต้อง'); priceInput.focus(); return; }

            const btn = document.getElementById('add-topping-btn');
            btn.disabled = true;
            btn.innerText = 'กำลังเพิ่ม...';

            try {
                const { error } = await supabaseClient.from('toppings').insert([{ name, price, is_active: true }]);
                if (error) throw error;
                nameInput.value = '';
                priceInput.value = '';
                fetchToppings();
            } catch (error) {
                console.error(error);
                alert('เพิ่มท็อปปิ้งไม่สำเร็จ');
            } finally {
                btn.disabled = false;
                btn.innerText = '+ เพิ่มท็อปปิ้ง';
            }
        }

        async function saveTopping(id, btn) {
            const name = document.getElementById(`tp-name-${id}`).value.trim();
            const price = parseInt(document.getElementById(`tp-price-${id}`).value, 10);
            if (!name || isNaN(price) || price < 0) { alert('กรุณากรอกชื่อและราคาให้ถูกต้อง'); return; }

            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';
            try {
                const { error } = await supabaseClient.from('toppings').update({ name, price }).eq('id', id);
                if (error) throw error;
                btn.innerText = 'บันทึกแล้ว ✔';
                setTimeout(() => { btn.innerText = 'บันทึก'; btn.disabled = false; }, 1200);
            } catch (error) {
                console.error(error);
                alert('บันทึกไม่สำเร็จ');
                btn.innerText = 'บันทึก';
                btn.disabled = false;
            }
        }

        async function deleteTopping(id, btn) {
            const name = document.getElementById(`tp-name-${id}`).value;
            if (!confirm(`ลบท็อปปิ้ง "${name}" ถาวร?\n(ถ้าแค่ของหมดชั่วคราว แนะนำให้ปิดสวิตช์แทน)`)) return;

            btn.disabled = true;
            try {
                const { error } = await supabaseClient.from('toppings').delete().eq('id', id);
                if (error) throw error;
                fetchToppings();
            } catch (error) {
                console.error(error);
                alert('ลบไม่สำเร็จ');
                btn.disabled = false;
            }
        }

        async function toggleTopping(id, checkbox) {
            const newState = checkbox.checked;
            const label = document.getElementById(`tp-status-${id}`);
            label.innerText = "กำลังบันทึก...";

            try {
                const { error } = await supabaseClient.from('toppings').update({ is_active: newState }).eq('id', id);
                if (error) throw error;
                label.innerText = newState ? 'เปิดขาย' : 'ปิดหมด';
                label.style.color = newState ? 'var(--active)' : 'var(--inactive)';
            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาดในการอัปเดตสถานะ");
                checkbox.checked = !newState;
                label.innerText = !newState ? 'เปิดขาย' : 'ปิดหมด';
                label.style.color = !newState ? 'var(--active)' : 'var(--inactive)';
            }
        }

        document.getElementById('new-topping-price').addEventListener('keydown', e => { if (e.key === 'Enter') addTopping(); });

        fetchAdminMenu();
        fetchToppings();
    </script>
</body>
</html>
